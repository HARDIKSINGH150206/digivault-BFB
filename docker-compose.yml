services:
  postgres:
    image: postgres:17-alpine
    container_name: digivault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digivault
      POSTGRES_PASSWORD: digivault
      POSTGRES_DB: digivault
    ports:
      - "5434:5432"
    volumes:
      - digivault_postgres_data:/var/lib/postgresql/data

  minio:
    # Docker Hub anonymous pulls of minio/minio are blocked in this
    # environment ("pull access denied") — quay.io mirror works.
    image: quay.io/minio/minio:latest
    container_name: digivault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: digivault
      MINIO_ROOT_PASSWORD: digivault123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - digivault_minio_data:/data

volumes:
  digivault_postgres_data:
  digivault_minio_data:
